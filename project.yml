name: Spades

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    # Simulator builds need no team. Device builds pick up Secrets.xcconfig.
    CODE_SIGN_STYLE: Automatic

packages:
  SpadesEngine:
    path: Packages/SpadesEngine

targets:
  Spades:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: SpadesEngine
        product: SpadesEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.spades
        PRODUCT_NAME: Spades
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Spades
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        # Portrait only: the table layout is designed around a phone held upright.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen:
          UIColorName: LaunchBackground
        ITSAppUsesNonExemptEncryption: false
        # Requested contextually, never on first launch. See §9.
        NSUserTrackingUsageDescription: >-
          Spades asks for permission to use tracking only so the optional
          rewarded videos you choose to watch can be personalised. Declining
          changes nothing about the game.
        GKGameCenterEnabled: true

  SpadesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SpadesTests
    dependencies:
      - target: Spades
      - package: SpadesEngine
        product: SpadesEngine
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  SpadesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/SpadesUITests
    dependencies:
      - target: Spades
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Spades:
    build:
      targets:
        Spades: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - SpadesTests
        - SpadesUITests
